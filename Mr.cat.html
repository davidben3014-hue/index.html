

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MR.CAT — Nehan's AI</title>

<style>
:root {
  --bg:#09070e;
  --panel:#14101c;
  --purple:#bd9aff;
  --border:#332542;
  --text:#f6f0ff;
  --muted:#a99bb9;
}
* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}

header {
  height:68px;
  padding:0 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:#09070ef5;
  z-index:10;
}

.brand { font-size:22px;font-weight:bold;letter-spacing:1px; }
.brand span { color:var(--purple); }
.subtitle { font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:2px; }

button,select,textarea { font:inherit; }
button { cursor:pointer;color:var(--text); }

#settingsButton {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 14px;
}

.settings {
  display:none;
  position:absolute;
  right:15px;
  top:58px;
  width:260px;
  padding:18px;
  border:1px solid var(--border);
  background:#181320;
  border-radius:15px;
  box-shadow:0 15px 40px #0009;
}
.settings.open { display:block; }

.settings label {
  display:block;
  margin:14px 0 7px;
  color:var(--muted);
  font-size:12px;
}
.settings select {
  width:100%;
  padding:10px;
  color:white;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:9px;
}

main {
  width:min(900px,100%);
  min-height:calc(100vh - 120px);
  margin:auto;
  padding:25px 22px;
  display:flex;
  flex-direction:column;
}

.welcome {
  margin:auto 0;
  min-height:45vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.logo {
  width:62px;
  height:62px;
  display:grid;
  place-items:center;
  border-radius:21px;
  color:#180d25;
  font-size:23px;
  font-weight:bold;
  background:linear-gradient(140deg,#d8c2ff,#8051c9);
  box-shadow:0 0 45px #b994ff20;
}

h1 { font-size:clamp(28px,5vw,42px);margin:20px 0 10px; }
h1 span { color:var(--purple); }
.welcome p { color:var(--muted);line-height:1.7;max-width:480px; }

.suggestions {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}
.suggestion {
  padding:12px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
}
.suggestion:hover { border-color:var(--purple); }

.messages {
  display:flex;
  flex-direction:column;
  gap:25px;
  padding:10px 0 30px;
}

.message {
  display:flex;
  gap:12px;
  align-items:flex-start;
  animation:appear .25s ease;
}

.avatar {
  width:32px;
  height:32px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:#291d38;
  color:var(--purple);
  font-size:11px;
  font-weight:bold;
}

.bubble {
  min-width:0;
  flex:1;
  line-height:1.8;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.message.user .bubble {
  flex:initial;
  max-width:90%;
  background:#21182d;
  border:1px solid #392b4c;
  padding:12px 16px;
  border-radius:16px 16px 5px 16px;
}
.message.assistant p { margin:0 0 12px; }

.typing { display:flex;gap:6px;padding:12px 0; }
.typing i {
  width:6px;height:6px;border-radius:50%;
  background:var(--purple);
  animation:bounce 1s infinite;
}
.typing i:nth-child(2) { animation-delay:.15s; }
.typing i:nth-child(3) { animation-delay:.3s; }

.composerArea {
  position:sticky;
  bottom:0;
  padding:15px 0 10px;
  background:linear-gradient(transparent,var(--bg) 18%);
}

/* LONG TEXT-ONLY CHATBOX */
.composer {
  width:100%;
  min-height:90px;
  display:flex;
  align-items:flex-end;
  gap:10px;
  padding:15px;
  background:#14111c;
  border:1px solid #423153;
  border-radius:24px;
  box-shadow:0 8px 35px #0005;
  transition:.2s;
}
.composer:focus-within {
  border-color:var(--purple);
  box-shadow:0 0 0 3px #bd9aff15;
}
textarea {
  flex:1;
  min-width:0;
  min-height:50px;
  max-height:200px;
  resize:none;
  outline:none;
  border:0;
  background:transparent;
  color:white;
  padding:12px 3px;
  font-size:16px;
  line-height:1.6;
}
textarea::placeholder { color:#8e819e; }

.action {
  width:44px;
  height:44px;
  flex-shrink:0;
  border-radius:14px;
  border:1px solid var(--border);
  background:#261c34;
  color:var(--purple);
}
.send {
  background:var(--purple);
  color:#180d25;
  border:0;
  font-size:22px;
  font-weight:bold;
}
.action:disabled { opacity:.5; }

.status { min-height:18px;color:var(--muted);font-size:12px;margin-top:8px; }
.note { text-align:center;color:#776b85;font-size:11px;margin-top:8px; }

pre {
  max-width:100%;
  overflow-x:auto;
  padding:12px;
  background:#0b0910;
  border:1px solid var(--border);
  border-radius:10px;
}
code { font-family:monospace; }

@keyframes appear {
  from { opacity:0;transform:translateY(8px); }
  to { opacity:1;transform:translateY(0); }
}
@keyframes bounce {
  0%,60%,100% { transform:translateY(0);opacity:.5; }
  30% { transform:translateY(-5px);opacity:1; }
}

@media(max-width:560px) {
  header { padding:0 14px; }
  main { padding:20px 13px; }
  .composer { min-height:78px;padding:10px; }
  .action { width:38px;height:38px; }
  .suggestions { display:grid;width:100%; }
}
</style>
</head>

<body>
<header>
  <div>
    <div class="brand">MR.<span>CAT</span></div>
    <div class="subtitle">NEHAN'S STUDY ASSISTANT</div>
  </div>

  <div style="position:relative">
    <button id="settingsButton" type="button">Settings</button>
    <div class="settings" id="settings">
      <strong>Preferences</strong>

      <label for="mode">Study language</label>
      <select id="mode">
        <option value="english">English mode</option>
        <option value="tamil">Tamil study mode</option>
        <option value="arabic">Arabic study mode</option>
      </select>
    </div>
  </div>
</header>

<main>
  <section class="welcome" id="welcome">
    <div class="logo">MC</div>
    <h1>What are we <span>learning</span> today?</h1>
    <p>Ask a question, practise Tamil or Arabic, or get help with school subjects.</p>

    <div class="suggestions">
      <button class="suggestion" data-prompt="Teach me five Tamil words with English meanings.">Practise Tamil</button>
      <button class="suggestion" data-prompt="Teach me Arabic grammar with examples and a quiz.">Study Arabic</button>
      <button class="suggestion" data-prompt="Explain a school topic step by step.">Explain a topic</button>
      <button class="suggestion" data-prompt="Give me a short revision quiz.">Revision quiz</button>
    </div>
  </section>

  <section class="messages" id="messages"></section>

  <section class="composerArea">
    <form class="composer" id="chatForm">
      <textarea id="prompt" rows="2" placeholder="Message MR.CAT..."></textarea>
      <button class="action send" id="sendButton" type="submit" title="Send">↑</button>
    </form>
    <div class="status" id="status"></div>
    <div class="note">MR.CAT can make mistakes. Check important answers with your teacher.</div>
  </section>
</main>

<script>
/*
Keep your existing API-key line unchanged here.
Do not publish a real API key in public HTML/GitHub.
*/
const GROQ_API_KEY = "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";

const $ = id => document.getElementById(id);
const messages = $("messages");
const promptBox = $("prompt");

let history = [];
let busy = false;

$("settingsButton").onclick = () => {
  $("settings").classList.toggle("open");
};

document.addEventListener("click", e => {
  if (!e.target.closest("#settings") &&
      !e.target.closest("#settingsButton")) {
    $("settings").classList.remove("open");
  }
});

document.querySelectorAll(".suggestion").forEach(button => {
  button.onclick = () => {
    promptBox.value = button.dataset.prompt;
    resizeInput();
    promptBox.focus();
  };
});

function resizeInput() {
  promptBox.style.height = "auto";
  promptBox.style.height =
    Math.min(promptBox.scrollHeight, 200) + "px";
}

promptBox.addEventListener("input", resizeInput);

promptBox.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("chatForm").requestSubmit();
  }
});

function addMessage(role, text, isTyping = false) {
  $("welcome").style.display = "none";

  const row = document.createElement("div");
  row.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "assistant" ? "MC" : "N";

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (isTyping) {
    const dots = document.createElement("div");
    dots.className = "typing";

    for (let i = 0; i < 3; i++) {
      dots.appendChild(document.createElement("i"));
    }

    bubble.appendChild(dots);
  } else {
    renderText(bubble, text);
  }

  row.append(avatar, bubble);
  messages.appendChild(row);

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

  return {row,bubble};
}

function renderText(element, text) {
  element.replaceChildren();

  const parts = String(text).split(
    /(```[\s\S]*?```|`[^`\n]+`)/g
  );

  for (const part of parts) {
    if (part.startsWith("```") && part.endsWith("```")) {
      const pre = document.createElement("pre");
      const code = document.createElement("code");

      code.textContent = part
        .replace(/^```[^\n]*\n?/,"")
        .replace(/```$/,"");

      pre.appendChild(code);
      element.appendChild(pre);

    } else if (part.startsWith("`") && part.endsWith("`")) {
      const code = document.createElement("code");
      code.textContent = part.slice(1,-1);
      element.appendChild(code);

    } else {
      part.split("\n").forEach(line => {
        if (line.trim()) {
          const p = document.createElement("p");
          p.textContent = line;
          element.appendChild(p);
        }
      });
    }
  }
}

function getSystemPrompt() {
  const mode = $("mode").value;

  let language = "Reply in clear English.";

  if (mode === "tamil") {
    language = "Focus on Tamil studies. Use Tamil script and give English meanings when helpful.";
  }

  if (mode === "arabic") {
    language = "Focus on Arabic studies. Use Arabic script, vowel marks when useful, and English meanings.";
  }

  return `You are MR.CAT, a patient school study assistant for Nehan.
Explain school topics step by step at a school-appropriate level.
Help with Tamil, Arabic, vocabulary, grammar, translation and revision.
Never use emojis. Be clear, kind and accurate. ${language}`;
}

async function sendMessage(text) {
  text = text.trim();

  if (!text || busy) return;

  busy = true;
  $("sendButton").disabled = true;
  $("status").textContent = "MR.CAT is thinking...";

  addMessage("user", text);
  promptBox.value = "";
  resizeInput();

  history.push({role:"user",content:text});

  const pending = addMessage("assistant","",true);

  try {
    const response = await fetch(
      "https://api.groq.com/openai/v1/chat/completions",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + GROQ_API_KEY
        },
        body:JSON.stringify({
          model:"openai/gpt-oss-120b",
          messages:[
            {role:"system",content:getSystemPrompt()},
            ...history.slice(-20)
          ],
          temperature:0.6,
          max_tokens:1200
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || "Groq request failed.");
    }

    const answer = data.choices?.[0]?.message?.content;

    if (!answer) {
      throw new Error("No answer returned.");
    }

    renderText(pending.bubble, answer);
    history.push({role:"assistant",content:answer});

  } catch (error) {
    pending.row.remove();
    history.pop();

    addMessage(
      "assistant",
      "I couldn't connect to the AI. Check the API key and try again.\n\n" +
      error.message
    );

  } finally {
    busy = false;
    $("sendButton").disabled = false;
    $("status").textContent = "";
    promptBox.focus();
  }
}

$("chatForm").addEventListener("submit", e => {
  e.preventDefault();
  sendMessage(promptBox.value);
});
</script>
</body>
</html>
